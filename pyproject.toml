[project]
name = "hpc-ai"
version = "0.1.0"
description = "Optional internal AI service for the HPC Pleos project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.2",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[project.scripts]
hpc-ai = "hpc_ai.__main__:main"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
